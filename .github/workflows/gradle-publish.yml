name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Bump version
      id: version
      run: |
        # Read current version from build.gradle
        VERSION_NAME=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*versionName "\([^"]*\)".*/\1/')
        VERSION_CODE=$(grep 'versionCode' app/build.gradle | head -1 | sed 's/.*versionCode \([0-9]*\).*/\1/')
        
        # Bump patch version
        MAJOR=$(echo $VERSION_NAME | cut -d. -f1)
        MINOR=$(echo $VERSION_NAME | cut -d. -f2)
        PATCH=$(echo $VERSION_NAME | cut -d. -f3)
        NEW_PATCH=$((PATCH + 1))
        NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
        NEW_VERSION_CODE=$((VERSION_CODE + 1))
        
        # Update build.gradle
        sed -i "s/versionCode [0-9]*/versionCode ${NEW_VERSION_CODE}/" app/build.gradle
        sed -i "s/versionName \"[^\"]*\"/versionName \"${NEW_VERSION}\"/" app/build.gradle
        
        # Export for later steps
        echo "version_name=${NEW_VERSION}" >> $GITHUB_OUTPUT
        echo "version_code=${NEW_VERSION_CODE}" >> $GITHUB_OUTPUT
        
        echo "Version bumped: ${VERSION_NAME} (${VERSION_CODE}) -> ${NEW_VERSION} (${NEW_VERSION_CODE})"

    - name: Build Release APK
      id: build
      run: |
        echo "=== Checking environment ==="
        java -version
        echo "=== Building APK ==="
        ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build_output.log
        echo "=== Build exit code: ${PIPESTATUS[0]} ==="
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "Build failed! Last 100 lines of output:"
          tail -100 build_output.log
          exit 1
        fi
        echo "=== APK files generated ==="
        find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || echo "No APK found!"

    - name: Collect APKs (one per ABI)
      id: apk
      run: |
        set -x
        mkdir -p out
        find app/build/outputs -name "*.apk" -type f
        while IFS= read -r f; do
          base=$(basename "$f" .apk)
          abi=${base#app-}; abi=${abi%-release}; abi=${abi%-debug}
          cp "$f" "out/DouyinTV-${{ steps.version.outputs.version_name }}-${abi}.apk"
        done < <(find app/build/outputs -name "*release*.apk" -type f)
        ls -la out
        test "$(ls out | wc -l)" -gt 0

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: douyin-tv-${{ steps.version.outputs.version_name }}
        path: out/*.apk

    - name: Commit version bump
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add app/build.gradle
        git commit -m "chore: bump version to ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }}) [skip ci]" || echo "No changes to commit"
        git push

    - name: Create Git Tag
      run: |
        git tag "v${{ steps.version.outputs.version_name }}"
        git push origin "v${{ steps.version.outputs.version_name }}"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.version.outputs.version_name }}"
        name: "DouyinTV v${{ steps.version.outputs.version_name }}"
        body: |
          ## DouyinTV v${{ steps.version.outputs.version_name }}
          
          ### 更新内容
          - 内核改为 GeckoView（Firefox 引擎随 APK 自带），不再依赖电视/投影自带的 WebView
          - 低内存配置：单内容进程、小缓存、离屏视频自动卸载
          - 遥控器：上下切视频、确认播放暂停、左右快进退、菜单键进入光标模式（可点登录按钮、拖滑块）
          
          ### 安装说明
          1. 下载 arm64-v8a 的 APK（装不上再试 armeabi-v7a）
          2. 通过 U 盘或 adb 安装到电视/投影
          3. 允许安装未知来源应用
          4. 启动应用开始使用
        files: out/*.apk
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
